  <link rel="icon" href="favicon.svg" type="image/svg+xml">

<body data-page="cabin" data-root="">

  <div class="vignette" aria-hidden="true"></div>

  <header class="mast">
    <a class="mark" href="#/">
      THE DARK ATLAS

    </a>
    <nav>
